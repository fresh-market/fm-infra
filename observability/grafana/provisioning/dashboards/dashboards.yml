# 대시보드도 데이터소스와 같은 이유로 Git 이 갖는다 (INF-32, OPS-2-18).
#
# 화면에서 만든 대시보드는 grafana-data 볼륨에만 남아 인스턴스를 다시 만들면 사라진다.
# allowUiUpdates 를 false 로 두어 화면에서 고친 것이 저장되지 않게 한다.
# 고칠 일이 생기면 JSON 을 커밋하고 컨테이너를 재시작한다.
apiVersion: 1

providers:
  - name: freshmarket
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
